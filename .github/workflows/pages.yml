name: Publish Pages manually
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-lessons.txt
      - run: python -m pip install -r scripts/requirements-lessons.txt
      - run: python scripts/verify_lessons.py
      - run: python scripts/verify_source_alignment.py
      - run: python scripts/verify_answers.py
      - run: python scripts/verify_notebook.py
      - run: python scripts/capture_source_figures.py --verify
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify chapter pages and navigation
        run: |
          npm run preview > /tmp/bigdata-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:4173/BigData_CBT/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
          npm run test:final-browser
          npm run test:handout-browser
          npm run test:notebook-browser
          npm run test:course-browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
